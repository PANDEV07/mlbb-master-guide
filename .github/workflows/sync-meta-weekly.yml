name: Sinkronisasi Meta Mingguan (Moonton GMS)

on:
  schedule:
    # Setiap Senin pukul 03:00 WIB (Minggu 20:00 UTC)
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-meta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sinkronisasi statistik hero resmi Moonton GMS & simpan snapshot riwayat
        run: npm run meta:sync

      - name: Validasi engine Meta & Tren
        run: npm run meta:test

      - name: Commit & push jika ada perubahan snapshot meta
        run: |
          git config user.name "mlbb-meta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/imports/hero-meta-stats.json src/data/imports/hero-meta-history.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan snapshot meta minggu ini."
          else
            DATE=$(date -u +"%Y-%m-%d")
            git commit -m "chore(meta): weekly Moonton GMS snapshot (${DATE})"
            git push
          fi
